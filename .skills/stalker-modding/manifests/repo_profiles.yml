repos:
  xray-monolith:
    authority_for:
      - engine capability lookup
      - modded exes behavior
      - added callbacks and helpers
      - engine-facing HUD or legs behavior
    not_primary_for:
      - project-specific workspace truth
      - onboarding tutorials
    preferred_queries:
      - callback name
      - helper symbol
      - lua_help_ex
      - legs
      - hud
  anomaly-modding-book:
    authority_for:
      - tutorials
      - file formats
      - onboarding
      - curated modding workflows
    not_primary_for:
      - authoritative engine semantics
      - project-specific workspace truth
    preferred_queries:
      - callbacks
      - script animations
      - mcm
      - file format
      - level compile
