interface:
  display_name: "Graphify"
  short_description: "STALKER workspace graph skill for Lua maps and subsystem routing"
  default_prompt: "Use $graphify to orient within this STALKER workspace: prefer existing graph artifacts first, then rebuild or refresh Lua-only maps for *.script and *.lua corpora when a graph would materially narrow the search surface."
dependencies:
  python_packages:
    - name: "graphifyy"
      description: "Python package required by the graphify skill pipeline"
policy:
  allow_implicit_invocation: true
